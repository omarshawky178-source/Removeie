name: iPhone simulator integration tests
on:
  workflow_dispatch:
  push:
    branches: [simulator-investigation]
jobs:
  simulator-tests:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; j=json.load(sys.stdin); print(next((d["udid"] for runtime,devices in j["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")), ""))')
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run WKWebView integration tests
        run: |
          xcodebuild -project Removeie.xcodeproj -scheme Removeie -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO test
